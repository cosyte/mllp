# Install hardening. Both settings are off by default at the pinned pnpm, so they are in force only
# because this file says so.
#
# minimumReleaseAge is pnpm's own 24 hours in minutes: malware is usually caught quickly, so refusing
# a release younger than a day is what stands between a compromised publish and this checkout during
# the window before it is pulled (https://pnpm.io/supply-chain-security).
# @cosyte is exempt by operator decision; every third-party package keeps the floor.
# trustPolicy `no-downgrade` refuses a package whose trust evidence is weaker than that of an
# earlier-published version of the same package.
#
# THE pnpm PIN IS PART OF THE CONTROL, NOT A SEPARATE FACT. minimumReleaseAge arrived in pnpm 10.16.0
# and trustPolicy in 10.21.0; an older pnpm ignores both keys outright, which is a settings file that
# decorates rather than defends. So `packageManager` in package.json is pinned above both floors
# (10.34.5), and lowering it below them disarms this file silently.
#
# There is deliberately no `packages:` key: this repository is one package, not a workspace, and at
# the pinned pnpm this file is the settings file as well as the workspace manifest.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # reason: first-party @cosyte package, exempt from the floor by operator decision
  - "@cosyte/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  # reason: every @types/node 22 release depends on undici-types ~6.21.0, and 6.21.0 is the only
  # version that range admits. It was published without a provenance attestation, after 6.13.0 had
  # one, so `no-downgrade` refuses it whenever pnpm resolves the tree afresh, as Dependabot does for
  # every update: the dev-dependencies group failed on it for every package and opened no pull
  # request. The lockfile already holds this exact version. Exempting the one version, not the
  # package, keeps the policy on every other undici-types release. Remove the entry when
  # @types/node 22 moves to a later undici-types line.
  - "undici-types@6.21.0"
