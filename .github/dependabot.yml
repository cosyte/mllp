version: 2
updates:
  # npm dev-dependencies (the parsers ship zero runtime deps)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Wait a day after a release before proposing it, the same 24 hours pnpm-workspace.yaml's
    # minimumReleaseAge holds every install to. Security updates are not delayed.
    cooldown:
      default-days: 1
    # The commit message, and so the pull request title, reads `chore(deps): bump ...` or
    # `chore(deps-dev): bump ...`: Conventional Commits, which pr-title.yml checks.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node describes the oldest Node.js this package runs on (engines: >=22), so it stays
      # on the 22 line. A newer major type-checks calls that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cosyte/process owns the vitest and typescript versions; this repository declares them
      # directly only because test files import vitest and the compiler API, pinned to exactly the
      # versions process runs. `cosyte-process check` fails a vitest mismatch. They move when
      # process does, never on their own.
      - dependency-name: "vitest"
      - dependency-name: "typescript"
  # keep GitHub Actions references current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. The
      # shared CI runs the official rhysd/actionlint release, checked by its SHA-256, instead.
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together (ST37). Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"
