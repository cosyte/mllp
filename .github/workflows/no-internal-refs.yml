name: Public-surface gate

# The founder directive of 2026-07-27: anything a consumer reads describes what the
# software does and what changed, never our item identifiers, phase and plan language,
# ADR numbers or process commentary. The founder's words: "The releases should also not
# speak on anything regarding phases, etc. That has no relevance to the user consuming
# it. This goes for readmes and documentation as well."
#
# WHY THIS IS A GATE AND NOT A MEMORY NOTE. Founder, the same day: "it needs to not
# just be a memory note, but something that is addressed in the workflow accordingly.
# This needs to not happen again." A one-time sweep regresses the first time someone
# writes `(CLIENT-20)` into a doc comment. mllp is the fifth repo to run this item and
# every earlier one confirmed the same thing: the class regrows wherever no gate holds
# it.
#
# mllp WAS NOT CLEAN when this landed, and the measurement is worth keeping next to
# the workflow because the recorded figure was wrong by two orders of magnitude. The
# backlog carried "mllp 4". Measured on the base commit with the final rule set, over
# four surfaces: public markdown + npm metadata 4, `src/` doc comments 389 rows across
# 18 of the 29 tracked source files this gate scans, `src/` string literals 0, and the
# BUILT declarations 440 rows across all eight `.d.ts`/`.d.cts` files of the three
# published entry points plus the shared type chunk. All four are now 0. The "4" was the
# public-markdown surface alone, which turned out to be about one percent of the job.
#
# EVERY FIGURE ABOVE WAS RE-DERIVED ON BOTH TREES AFTER THE RULE SET WAS FINAL, and that
# is not pedantry: the first figures quoted here were 391/378/444 over "31 files", taken
# before the compound-adjective guard and the `where|are|was|were` lookahead landed and
# counting two `.gitkeep` files the gate never opens. A refuter caught all four. This
# script's own residual (xii) says it plainly: A COUNT IS A FUNCTION OF THE RULE SET, so
# quote a count with the tree AND the rules it was taken under, or not at all.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs`, which is
# this repository's own `scripts/check-no-internal-refs.sh`. The job below delegates the
# plumbing (checkout, pnpm, Node) to the shared gate workflow, which carries no pattern,
# no allow-list and no file selection of its own: it prepares the tree, runs the command,
# and lets the command's exit status decide the job. The detection rules, the self-tests,
# the known project prefixes and the standards-designation exemptions all stay in that
# script, which self-tests before it reports and refuses to print OK from a scan that did
# not read all of its input.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml: the same reasoning as
# `no-emdash.yml` in this repo. mllp's `ci` job calls the shared ci.yml pipeline, a
# fixed ladder that runs no arbitrary repo script, and adding this rule there would red
# every caller that has not done this remediation yet.
#
# NO PR-TEXT HALF, and that is the one structural difference from `no-emdash.yml`.
# That gate scans the PR title, body and commit messages because the brand rule names
# commit messages explicitly. THIS rule says the opposite: identifiers BELONG in the
# commit, the PR, the changeset and CHANGELOG.md. Scanning PR text here would red on
# correct work. The half that keeps identifiers out of a published RELEASE BODY exists
# and is not here: `scripts/release-notes.mjs assert` runs inside the shared release
# pipeline.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a branch ruleset must
# require. That string, not this workflow's `name:`, is what a ruleset binds to, and the
# distinction is not academic: `transform` shipped a workflow titled "Public-surface
# gate" (as this one is) whose emitted context is `no-internal-refs`, and requiring the
# title would have blocked every pull request permanently. Renaming the job detaches the
# requirement with no error anywhere, and a required context nothing emits blocks every
# pull request.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Pinned to the 40-character commit, not to the tag beside it: a tag can be moved or
    # deleted by anyone who gains write access to the workflow's repository, so a tag is
    # not an immutable reference and is not a pin. The trailing comment is the published
    # reference that commit was released as, so the release note stays findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
