name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix. mllp ships a PHI scanner (it
  # transports HL7 v2 payloads, so its fixtures carry the same PHI shapes hl7's do), so the shared
  # pipeline's optional PHI-scan step is switched on.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@main
    with:
      run-phi-scan: true

  # The programs under examples/, run against the BUILT package the way a consumer imports it:
  # `pnpm examples` (scripts/run-examples.ts) fails when any example exits non-zero, and each
  # example checks its own output. Added on top of the shared caller above, never instead of it.
  # `examples` is a new check-run context and deliberately not a required one yet: let it run on
  # main first, then read the real names off a live check run before adding them to a ruleset.
  examples:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the examples import the built package)
        run: pnpm build
      - name: Run every example
        run: pnpm examples
