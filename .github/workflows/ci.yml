name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run of main, at an odd minute: GitHub delays scheduled runs at the top of the hour.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the reference's default Node matrix, 22, 24 and 26: the
  # README claims only the lines CI runs. mllp ships a PHI scanner (it transports HL7 v2 payloads,
  # so its fixtures carry the same PHI shapes hl7's do), so the shared pipeline's optional PHI-scan
  # step is switched on. Every call to cosyte/.github names one published reference, pinned by its
  # commit: this caller, weekly-mutation.yml and nightly-properties.yml at
  # `workflows-2026-11-10-398cd4ded647`, the first to carry the testing standard's jobs, and the
  # other workflow files at `workflows-2026-11-10-0be6757a7738` until a change of their own moves
  # them (the newer release workflow gates a publish on the weekly mutation result, which wants a
  # weekly run on `main` first).
  #
  # `verify` runs on Linux and macOS, each on Node 22, 24 and 26. The Ubuntu legs keep the names the
  # ruleset requires; the macOS legs are new contexts, `ci / verify (<node>, macos-latest)`. The
  # suite also runs under Bun and under Deno, each in its own job (`ci / bun`, `ci / deno`), on
  # Linux. Windows runs `verify`'s steps in the `windows` job below rather than in `verify`: see
  # there.
  #
  # The testing and performance standards' jobs run beside `verify`, never after it, so a pull
  # request waits for the slowest job rather than their sum:
  # - `coverage-ratchet`: coverage held to quality-floor.json, and on a pull request every changed
  #   line that coverage counts must have run and no floor may be lowered or removed;
  # - `mutation` (pull requests only): the changed source files mutated with stryker.config.mjs,
  #   and every mutant in the changed lines killed;
  # - `scaling-gate`: `pnpm test:perf`, the scaling gate on the receive path and on a round trip
  #   through a connection, with its self-checks, never under coverage;
  # - `bench-compare` (pull requests only): bench/mllp.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner. Advisory: it never fails, so never require it.
  # A skipped job satisfies a required check, so require each of the others only while its input
  # below stays on. The full reading, the socket reading and the profile are bench.yml; the full
  # mutation run is weekly-mutation.yml, and the deep property run nightly-properties.yml.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      run-phi-scan: true
      run-bun: true
      run-deno: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true

  # `verify`'s steps on Windows, on Node 22, 24 and 26, but two: the type-export check and the
  # coverage gate. Not
  # the shared `verify` on `windows-latest`: that leg runs `pnpm attw`, and the attw gate in
  # @cosyte/script-utils 0.1.10 (`cosyte-attw`) starts `npm`, `pnpm` and `attw` by name with no
  # shell, which Windows cannot do for their `.cmd` launchers (measured on the same reference in a
  # sibling library: `spawnSync ... node_modules\.bin\attw ENOENT`, after every earlier step
  # passed). What attw checks is the packed manifest and its types, the same bytes on every system,
  # and the Linux and macOS legs check them. Once a script-utils release runs that gate on Windows,
  # add "windows-latest" to `os` above and delete this job.
  #
  # The suite runs whole here (`pnpm test`), but not under the coverage gate: the gate is 100% of
  # `src/`, and the lines in `src/server/server.ts` that read a wildcard spelled as a resolver
  # shorthand (`"0"`, `"0x0.0.0.0"`) and refuse it after the bind cannot be reached on Windows,
  # whose resolver refuses those spellings before any bind, so their cases are skipped there
  # (`test/server/bind-safety.test.ts`; measured: 99.86% of lines). The gate holds on Linux and
  # macOS in `verify` and in `coverage-ratchet`.
  windows:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm phi-scan
      - run: pnpm test
      # `pnpm test:coverage` is left out here, for the reason above the job.
      - run: pnpm build
      # `pnpm attw` is left out here, for the reason above the job.
      - name: Dual ESM/CJS smoke
        run: |
          test -f dist/index.mjs && test -f dist/index.cjs && test -f dist/index.d.ts
          node -e "import(require('node:url').pathToFileURL('dist/index.mjs').href).then(() => console.log('esm ok'))"
          node -e "require('./dist/index.cjs'); console.log('cjs ok')"

  # The programs under examples/, run against the BUILT package the way a consumer imports it:
  # `pnpm examples` (scripts/run-examples.ts) fails when any example exits non-zero, and each
  # example checks its own output. Added on top of the shared caller above, never instead of it.
  # Its contexts, `examples (22)`, `examples (24)` and `examples (26)`, are required by the
  # ci-required-checks ruleset.
  examples:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the examples import the built package)
        run: pnpm build
      - name: Run every example
        run: pnpm examples

  # The repository's documents, each checked by the shared checker in @cosyte/script-utils: the
  # README against the house skeleton and npm's size limit, CLAUDE.md against the card spec, and
  # the package.json description against the catalog. `pnpm check:documents` runs those three
  # locally. The job also runs `pnpm check:process`, which fails when a verb script stops
  # delegating to the shared @cosyte/process or cosyte-process.config.json is invalid, and
  # `pnpm check:docs-reference` (@cosyte/process's `cosyte-docs-reference --check`), which fails
  # when the API reference committed in docs-content/api/ differs from what the TSDoc comments of
  # the root and every subpath in `exports` generate (an export changed and `pnpm docs:reference`
  # was not run), when an export has no TSDoc summary, or when a TSDoc comment holds a heading.
  # `pnpm check:documents` runs the reference check after the three document checks.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
      - run: pnpm check:process
      - run: pnpm check:docs-reference
