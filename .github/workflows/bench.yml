name: Bench

# A reading of this build on a GitHub-hosted runner, in three parts, each kept as an artifact and
# shown in its job's summary:
# - `reading`: every case of bench/mllp.bench.mjs, the large sizes included, with @cosyte/bench:
#   throughput, latency p50/p95/p99, allocations per operation, peak heap, a long run for leaks,
#   and the cold import with every file it loads and its gzip size. One job per benchmark, side by
#   side, so the reading finishes inside a pull request's wait;
# - `socket`: bench/socket.mjs, the same traffic over a real 127.0.0.1 socket, client and server
#   in two processes, with the memory outside the V8 heap that holds a frame's bytes;
# - `open-loop`: bench/open-loop.mjs, acknowledgment latency at fixed send rates over plain TCP and
#   TLS, with TCP_NODELAY as the package sets it, turned off by option, and set from outside;
# - `profile`: bench/profile.mjs, a CPU and a sampled heap profile of the hottest paths.
#
# On demand, and on a pull request that changes what is measured, so a change to the suite is
# measured where it will be read. ADVISORY: it fails only when it cannot measure (a suite that does
# not load, a process that dies, a results file that does not match the schema), never on a number,
# and it is never a required check. Jobs on different runners are not compared with each other;
# each reading names the machine it ran on.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reading:
    name: reading (${{ matrix.benchmark }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - "FrameReader: decode"
          - "FrameReader: decode, split across reads"
          - "encodeFrame"
          - "Connection: send, then ACK"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read ${{ matrix.benchmark }}
        env:
          BENCHMARK: ${{ matrix.benchmark }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results
          name="${BENCHMARK//[^A-Za-z]/-}"
          status=0
          pnpm bench:reading --commit "${COMMIT}" --only "${BENCHMARK}" \
            --out "bench-results/reading-${name}.json" \
            --summary "bench-results/reading-${name}.md" || status=$?
          if [ -f "bench-results/reading-${name}.md" ]; then
            cat "bench-results/reading-${name}.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          # Exit 2 with a results file is a measure the reading skipped, named in it with its typed
          # reason (a warmup that did not settle, an allocation window that always collected): a
          # skip is reported, never read as a number. Anything else is a reading that failed.
          if [ "${status}" -eq 2 ] && [ -f "bench-results/reading-${name}.json" ]; then
            echo "::notice::bench reading ${BENCHMARK}: a measure was skipped; its reason is in the results"
          elif [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          pnpm exec cosyte-bench check "bench-results/reading-${name}.json"
      - name: Keep the reading
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reading-${{ strategy.job-index }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 30

  socket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read the socket path
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:socket --out bench-results/socket
          cat bench-results/socket/socket.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the reading
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-socket
          path: bench-results/socket/
          if-no-files-found: warn
          retention-days: 30

  open-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Read acknowledgment latency at fixed rates
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:open-loop --out bench-results/open-loop
          cat bench-results/open-loop/open-loop.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the reading
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-open-loop
          path: bench-results/open-loop/
          if-no-files-found: warn
          retention-days: 30

  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Profile the hottest paths
        shell: bash
        run: |
          set -euo pipefail
          pnpm bench:profile --out bench-results/profile
          cat bench-results/profile/profile.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Keep the profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-profile
          path: bench-results/profile/
          if-no-files-found: warn
          retention-days: 30
