name: Em-dash gate

# The brand rule (founder directive 2026-07-24, written down in the knowledgebase
# repo at 06-brand/voice-and-tone.md: "No em dashes. Ever.") bans U+2014 outright
# across every cosyte surface, and names commit messages explicitly. This workflow is
# the CI half of that rule for mllp: the tracked files, and the text that is not a
# file.
#
# mllp WAS already clean when this landed, and the measurement behind that claim is
# the whole tree rather than a sample: all 152 tracked files were read byte by byte
# and none carries U+2014, as the literal character or in any encoded form. That
# distinction matters because a markdown-only count is exactly what wrongly cleared
# dicom, which turned out to hold six live em dashes in four non-markdown files. So
# this gate changed no content here and exists purely to stop a regression. A green
# run on a clean tree proves nothing on its own, which is why the script it calls
# refuses to print OK from a scan that did not read everything it was handed.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-emdash`, which is this
# repository's own `scripts/check-no-emdash.sh`. The jobs below delegate the plumbing
# (checkout, pnpm, Node) to the shared gate workflow, and that workflow carries no
# pattern, no allow-list and no file selection of its own: it prepares the tree, runs
# the command, and lets the command's exit status decide the job. So the rule, the
# variant and every measurement behind them stay in this repository.
#
# mllp used to track ONE binary, `vendor/cosyte-hl7-0.0.0.tgz` (the packed `@cosyte/hl7`
# devDependency, 472,097 bytes, 1,774 NUL bytes). It is why this repo runs website's
# NUL-exclusion variant of the script rather than the text-only one hl7, fhir,
# knowledgebase, pathways, x12, ncpdp and dicom run. The reasoning, the cost, and the
# measurements behind that choice are in the script header; the short version is that
# a compressed stream can contain the em dash bytes by coincidence, and that red would
# have no fix. The tarball left on 2026-08-10 (`@cosyte/hl7` installs from npm) and the
# VARIANT STAYS: the argument is about tracked binaries as a class, and the script header
# says why the specimen's departure does not retire it.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is
# named `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to
# those exact strings: renaming the job detaches the requirement with no error
# anywhere, and a required context nothing emits blocks every pull request. Do not
# rename it.
#
#   `no-emdash / tracked-files` is REQUIRED and is the one that blocks a merge.
#   `no-emdash / messages` runs, reds its own context, and is deliberately NOT required.
#   Dependabot composes a pull request body out of upstream release notes, em dashes
#   included, and a gate that fails on someone else's clock becomes a tax. The detection
#   is unchanged either way; only what blocks is narrowed, and that narrowing is
#   deliberate.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   mllp's `ci` job calls the shared ci.yml pipeline, which runs a fixed ladder and no
#   arbitrary repo script. Adding the gate there would also flip crew, config, iac,
#   and assets red on their next run: all four violate the ban wholesale today, and
#   remediating them is separate, founder-gated work. A shared pipeline is the wrong
#   place to land a rule several of its callers cannot yet satisfy. The correct
#   variant of the script also differs per repo (repos with no binaries take
#   knowledgebase's text-only shape, repos tracking undeclared binaries take website's
#   NUL-partition one, which is this repo), so the scanner stays per-repo and only the
#   harness is shared.
#
#   Within mllp, the deciding factor is the trigger. The message half needs the
#   `edited` activity type, which is not a default: without it, a title or body edited
#   after the last push is never re-checked. What makes that matter is exactly what a
#   squash merge lands here, which is a repo setting and was read rather than assumed:
#   `squash_merge_commit_title: COMMIT_OR_PR_TITLE` and
#   `squash_merge_commit_message: COMMIT_MESSAGES`, with squash the only merge method
#   enabled. So the subject on main comes from the PR title (or from the lone commit's
#   subject, when the branch has exactly one), and the body is the branch commit
#   messages concatenated. The PR BODY does not land. It is scanned anyway,
#   deliberately: it is a cosyte surface in its own right and it costs nothing to
#   cover. But ci.yml's triggers drive the shared pipeline over the Node 22 + 24
#   matrix (typecheck, lint, format, PHI scan, test, coverage, build, attw, dual
#   ESM/CJS smoke). Re-running all of that every time someone fixes a typo in a PR
#   description is a large cost for no extra safety.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Pinned to the 40-character commit, not to the tag beside it: a tag can be moved or
    # deleted by anyone who gains write access to the workflow's repository, so a tag is
    # not an immutable reference and is not a pin. The trailing comment is the published
    # reference that commit was released as, so the release note stays findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
