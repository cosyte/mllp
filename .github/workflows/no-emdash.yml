name: Em-dash gate

# The brand rule (founder directive 2026-07-24, written down in the knowledgebase
# repo at 06-brand/voice-and-tone.md: "No em dashes. Ever.", and widened to the en dash
# on 2026-11-07) bans the em dash (U+2014) and the en dash (U+2013) outright across
# every Cosyte surface, and names commit messages explicitly. This workflow is the CI
# half of that rule for mllp: the tracked files, and the text that is not a file.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-emdash`, which runs the
# one shared implementation in `@cosyte/script-utils`, installed from this repository's
# lockfile. The jobs below call the shared INSTALLING gate workflow for that reason: it
# installs from the committed lockfile, runs the command, and lets the command's exit
# status decide the job, with no pattern or allow-list of its own. What this repository
# leaves out of the scan is `scripts/check-no-emdash.exclude`, which the gate reads
# itself: today only CHANGELOG.md, for the reason written there.
#
# This repository ran its own copy of the scanner until the shared one carried a
# command-line form. The copy read the frozen CHANGELOG archive for em dashes only and
# excluded NUL-bearing files as binary; the shared gate excludes by path instead, and
# this tree tracks no NUL-bearing file. The banned forms are the same twelve.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is
# named `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to
# those exact strings: renaming the job detaches the requirement with no error
# anywhere, and a required context nothing emits blocks every pull request. Do not
# rename it.
#
#   `no-emdash / tracked-files` is REQUIRED and is the one that blocks a merge.
#   `no-emdash / messages` runs, reds its own context, and is deliberately NOT required.
#   Dependabot composes a pull request body out of upstream release notes, em dashes
#   included, and a gate that fails on someone else's clock becomes a tax. The detection
#   is unchanged either way; only what blocks is narrowed, and that narrowing is
#   deliberate.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   mllp's `ci` job calls the shared ci.yml pipeline, which runs a fixed ladder and no
#   arbitrary repo script, and the message half needs triggers of its own.
#
#   Within mllp, the deciding factor is the trigger. The message half needs the
#   `edited` activity type, which is not a default: without it, a title or body edited
#   after the last push is never re-checked. What makes that matter is exactly what a
#   squash merge lands here, which is a repo setting and was read rather than assumed:
#   since 2026-11-07, `squash_merge_commit_title: PR_TITLE` and
#   `squash_merge_commit_message: PR_BODY`, with squash the only merge method enabled.
#   So the commit on main IS the PR title and the PR body, and an edit to either after
#   the last push changes what lands. But ci.yml's triggers drive the shared pipeline
#   over the Node 22, 24 and 26 matrix (typecheck, lint, format, PHI scan, test,
#   coverage, build, attw, dual ESM/CJS smoke). Re-running all of that every time
#   someone fixes a typo in a PR description is a large cost for no extra safety.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed required check and block the merge until someone re-runs it. Each run takes seconds, so
# every one finishes and the newest result stands.

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Pinned to the 40-character commit, not to the tag beside it: a tag can be moved or
    # deleted by anyone who gains write access to the workflow's repository, so a tag is
    # not an immutable reference and is not a pin. The trailing comment is the published
    # reference that commit was released as, so the release note stays findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
